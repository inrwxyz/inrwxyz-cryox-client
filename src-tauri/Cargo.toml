[package]
name = "inex-client"
version = "1.0.0"
description = "CRYOX CLIENT — Minecraft launcher"
authors = ["Cryox Studios"]
edition = "2021"

[lib]
name = "inex_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "fs", "macros", "net", "io-util", "rt"] }
reqwest = { version = "0.13", features = ["json"] }
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
notify = "6"

# Standard Windows release profile (prevents heuristic false positives)
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = false

[profile.dev]
debug = 0
